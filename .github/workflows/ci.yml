name: CI

on:
  push: # every branch, not just main - feature branches get CI too
  pull_request:
  workflow_dispatch:

jobs:
  test-extensions:
    name: Compile & test (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            target: linux-x64
            runs-on: ubuntu-latest
          - arch: arm64
            target: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # Not bundled into a development checkout, so fetch the pinned release:
      # with it present, the lint/format tests run against the real thing
      # instead of being skipped.
      - name: Fetch Verible
        run: toolchains/fetch-verible.sh ${{ matrix.target }}

      - name: Test (real iverilog and Verible)
        run: npm test

      # A development build: no toolchain inside (the Verible fetched for the
      # tests is removed again). build-universal-vsix.yml makes the bundled one.
      - name: Package extension (.vsix)
        run: |
          rm -rf extensions/veriscode/bin
          mkdir -p dist
          (cd extensions/veriscode && npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository -o ../../dist/)

      - uses: actions/upload-artifact@v4
        with:
          name: veriscode-extension-${{ matrix.arch }}
          path: dist/*.vsix
