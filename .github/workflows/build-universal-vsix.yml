name: Build portable multi-platform .vsix

# Produces a single .vsix (one extension) that bundles Verible + Icarus
# Verilog binaries for Windows (x64), macOS (x64 + arm64), and Linux
# (x64 + arm64) all together (extensions/veriscode/bin/<platform>-<arch>/...)
# - resolveBinary() in toolchain.ts already picks the right one for
# whatever OS/arch the extension is running on, at runtime. Install once
# via "Install from VSIX..." in any VS Code/VSCodium/Cursor/etc., on any
# of those platforms.
#
# There's no separate win32-arm64 leg: Verible/Icarus have no native
# Windows-on-ARM builds, so resolveBinary() falls back to the win32-x64
# build there, which runs transparently under Windows 11's built-in x64
# emulation (Prism) - the same trick macOS's Rosetta 2 provides, which is
# why a native darwin-arm64 leg exists below anyway (better performance
# than relying on Rosetta) even though the fallback would also work there.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  verible:
    # Verible ships prebuilt static archives for every platform, so
    # fetching all of them is just downloads - no native build needed,
    # no matrix needed either.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch Verible for every platform
        run: |
          for target in linux-x64 linux-arm64 win32-x64 darwin-x64 darwin-arm64; do
            toolchains/fetch-verible.sh "$target"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: verible-bins
          path: extensions/veriscode/bin/

  icarus-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: toolchains/fetch-icarus-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: icarus-linux-x64
          path: extensions/veriscode/bin/linux-x64/

  icarus-linux-arm64:
    # Free, GA hosted arm64 Linux runner (public repos only - see
    # https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/).
    # fetch-icarus-linux.sh is arch-agnostic (detects via `uname -m`), so
    # this is the exact same script as the x64 job above.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - run: toolchains/fetch-icarus-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: icarus-linux-arm64
          path: extensions/veriscode/bin/linux-arm64/

  icarus-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          if (-not (Get-Command jq -ErrorAction SilentlyContinue)) {
            choco install jq -y --no-progress
          }
        shell: pwsh
      - run: pwsh -NoProfile -File toolchains/fetch-icarus-windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: icarus-win32-x64
          path: extensions/veriscode/bin/win32-x64/

  icarus-macos-x64:
    runs-on: macos-15-intel # Intel runner
    steps:
      - uses: actions/checkout@v6
      - run: toolchains/fetch-icarus-macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: icarus-darwin-x64
          path: extensions/veriscode/bin/darwin-x64/

  icarus-macos-arm64:
    runs-on: macos-15 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v6
      - run: toolchains/fetch-icarus-macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: icarus-darwin-arm64
          path: extensions/veriscode/bin/darwin-arm64/

  test-bundle:
    # The point of the release build is that it works with nothing else
    # installed, so prove that before packaging: on a clean runner for each
    # platform, with only the staged binaries (no apt/brew/choco Icarus, no
    # Verible on PATH), run the whole test suite.
    name: Test bundled toolchain (${{ matrix.target }})
    needs:
      [
        verible,
        icarus-linux,
        icarus-linux-arm64,
        icarus-windows,
        icarus-macos-x64,
        icarus-macos-arm64,
      ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
          - target: win32-x64
            runs-on: windows-latest
          - target: darwin-x64
            runs-on: macos-15-intel
          - target: darwin-arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v7
        with:
          name: verible-bins
          path: extensions/veriscode/bin/
      - uses: actions/download-artifact@v7
        with:
          name: icarus-${{ matrix.target }}
          path: extensions/veriscode/bin/${{ matrix.target }}/
      # Artifacts don't keep file permissions. Everything under bin/ is a
      # program or a module one of them loads (Icarus's lib/ holds the
      # compiler passes iverilog runs), so mark it all executable.
      - name: Restore executable bits
        if: runner.os != 'Windows'
        run: chmod -R a+x extensions/veriscode/bin/${{ matrix.target }}
      - run: npm ci
      - run: npm run compile
      - name: Test, using only the bundled toolchain
        run: node extensions/veriscode/test/run.js --bundled

  package:
    needs: test-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      # Verible's per-platform binaries and Icarus's live in the same
      # extensions/veriscode/bin/<platform-arch>/ directories (Verible's
      # go straight in each dir, Icarus's support files one level down in
      # lib/), so the downloads below merge into one tree without clashing.
      - uses: actions/download-artifact@v7
        with:
          name: verible-bins
          path: extensions/veriscode/bin/
      - uses: actions/download-artifact@v7
        with:
          name: icarus-linux-x64
          path: extensions/veriscode/bin/linux-x64/
      - uses: actions/download-artifact@v7
        with:
          name: icarus-linux-arm64
          path: extensions/veriscode/bin/linux-arm64/
      - uses: actions/download-artifact@v7
        with:
          name: icarus-win32-x64
          path: extensions/veriscode/bin/win32-x64/
      - uses: actions/download-artifact@v7
        with:
          name: icarus-darwin-x64
          path: extensions/veriscode/bin/darwin-x64/
      - uses: actions/download-artifact@v7
        with:
          name: icarus-darwin-arm64
          path: extensions/veriscode/bin/darwin-arm64/

      # See the note in test-bundle: artifacts drop permissions, and the
      # .vsix records whatever is on disk here.
      - name: Restore executable bits
        run: chmod -R a+x extensions/veriscode/bin

      - name: Install & compile
        run: |
          npm ci
          npm run compile

      - name: Package portable .vsix
        run: |
          mkdir -p dist
          (cd extensions/veriscode && npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository -o ../../dist/)

      - uses: actions/upload-artifact@v6
        with:
          name: veriscode-portable-vsix
          path: dist/*.vsix
